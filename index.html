<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friend Availability Calendar</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #6c5ce7; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; margin-top: 20px; }
        .setup-box { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 14px; border: 2px solid #dfe6e9; border-radius: 8px; font-size: 16px; }
        button { padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-label { text-align: center; font-size: 0.7em; font-weight: bold; color: #b2bec3; }
        .cell { background: #fff; border: 1px solid #f1f2f6; min-height: 65px; border-radius: 6px; padding: 4px; cursor: pointer; position: relative; touch-action: manipulation; }
        .cell.today { border: 2px solid var(--primary); }
        .date-num { font-size: 0.8em; font-weight: 600; }
        .initials-list { display: flex; flex-wrap: wrap; gap: 3px; }
        .initial { background: var(--primary); color: white; font-size: 0.6em; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; }
        .hidden { display: none; }
        .error-overlay { background: #ff7675; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Firebase Config Warning -->
        <div id="config-error" class="error-overlay hidden">
            ⚠️ <b>Firebase Not Configured!</b><br>Update the firebaseConfig in your code.
        </div>

        <!-- Step 1: Login -->
        <div id="step-name" class="setup-box">
            <h2>Welcome!</h2>
            <input type="text" id="user-name" placeholder="Your Name (e.g. Alice)">
            <button onclick="saveName()">Continue</button>
        </div>

        <!-- Step 2: Join Calendar -->
        <div id="step-join" class="setup-box hidden">
            <h2>Join a Calendar</h2>
            <input type="text" id="cal-id" placeholder="Calendar Name (e.g. HawaiiTrip)">
            <button onclick="joinCalendar()">Open Calendar</button>
        </div>

        <!-- Step 3: Calendar -->
        <div id="step-calendar" class="hidden">
            <div style="display:flex; justify-content: space-between; margin-bottom:10px;">
                <small>👤 <b id="display-user"></b></small>
                <small>📅 <b id="display-cal"></b></small>
            </div>
            <div class="calendar-nav">
                <button onclick="changeMonth(-1)">❮</button>
                <h3 id="month-year" style="margin:0;"></h3>
                <button onclick="changeMonth(1)">❯</button>
            </div>
            <div class="grid" id="calendar-grid"></div>
            <button onclick="copyShareLink()" style="width:100%; background: #00b894; margin-top:20px;">Copy Share Link</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyC9yeUnuafmXsBoFn3zBn5Dh9BXIRpABTg",
            authDomain: "friend-calendar-916.firebaseapp.com",
            databaseURL: "https://friend-calendar-916-default-rtdb.firebaseio.com/",
            projectId: "friend-calendar-916",
            storageBucket: "friend-calendar-916.firebasestorage.app",
            messagingSenderId: "148782966072",
            appId: "1:148782966072:web:b81fa030d52795da800dcd"
        };

        // --- 2. INITIALIZATION ---
        var currentUser = localStorage.getItem('cal_username') || "";
        var currentRoom = "";
        var viewDate = new Date();
        var remoteData = {};
        var db;

        // Safety check: Does the config still have placeholders?
        if (firebaseConfig.apiKey.includes("PASTE_HERE") || firebaseConfig.databaseURL.includes("PASTE_HERE")) {
            document.getElementById('config-error').classList.remove('hidden');
        } else {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            if (roomParam) document.getElementById('cal-id').value = roomParam;
            
            if (currentUser) {
                showStep('step-join');
            }
        };

        // --- 3. FUNCTIONS ---
        function saveName() {
            const nameInput = document.getElementById('user-name').value.trim();
            if (!nameInput) return alert("Please enter your name");
            currentUser = nameInput;
            localStorage.setItem('cal_username', currentUser);
            showStep('step-join');
        }

function joinCalendar() {
    if (!db) return alert("Firebase not connected. Check your config keys!");
    
    const roomInput = document.getElementById('cal-id').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '-');
    if (!roomInput) return alert("Enter a calendar name");
    
    currentRoom = roomInput;
    document.getElementById('display-user').innerText = currentUser;
    document.getElementById('display-cal').innerText = currentRoom;
    
    // 1. Show the step immediately
    showStep('step-calendar');
    
    // 2. Draw a blank calendar right away so it's not empty
    renderGrid(); 

    // 3. Then listen for the data from Firebase
    db.ref('calendars/' + currentRoom).on('value', (snapshot) => {
        remoteData = snapshot.val() || {};
        renderGrid(); // Redraw when the data actually arrives
    }, (error) => {
        console.error("Firebase Sync Error: ", error);
        alert("Could not sync with Database. Check your Firebase Rules!");
    });
}

        function renderGrid() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            document.getElementById('month-year').innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(viewDate);

            ['S','M','T','W','T','F','S'].forEach(d => {
                const el = document.createElement('div');
                el.className = 'day-label'; el.innerText = d;
                grid.appendChild(el);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${month + 1}-${d}`;
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (new Date().toDateString() === new Date(year, month, d).toDateString()) cell.classList.add('today');
                
                cell.innerHTML = `<div class="date-num">${d}</div>`;
                const list = document.createElement('div');
                list.className = 'initials-list';
                
                const people = remoteData[dateStr] || [];
                people.forEach(p => {
                    const span = document.createElement('span');
                    span.className = 'initial';
                    span.innerText = p.charAt(0).toUpperCase();
                    list.appendChild(span);
                });
                cell.appendChild(list);
                cell.onclick = () => toggleDay(dateStr, people);
                grid.appendChild(cell);
            }
        }

        function toggleDay(dateStr, currentPeople) {
            let newList = Array.isArray(currentPeople) ? [...currentPeople] : [];
            if (newList.includes(currentUser)) {
                newList = newList.filter(u => u !== currentUser);
            } else {
                newList.push(currentUser);
            }
            db.ref('calendars/' + currentRoom + '/' + dateStr).set(newList);
        }

        function changeMonth(dir) {
            viewDate.setMonth(viewDate.getMonth() + dir);
            renderGrid();
        }

        function showStep(id) {
            document.getElementById('step-name').classList.add('hidden');
            document.getElementById('step-join').classList.add('hidden');
            document.getElementById('step-calendar').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function copyShareLink() {
            const url = window.location.origin + window.location.pathname + '?room=' + currentRoom;
            navigator.clipboard.writeText(url);
            alert("Link copied! Send it to friends.");
        }
    </script>
</body>
</html>
